[theme]
base = "light"
primaryColor = "#5E7A5A"
backgroundColor = "#FAF7F2"
secondaryBackgroundColor = "#F1ECE3"
textColor = "#2B2A26"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap, sans-serif"
headingFont = "Fraunces:https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap, serif"
baseRadius = "12px"
borderColor = "#E6DFD3"
linkColor = "#4E6A4A"
chartCategoricalColors = ["#2E845A", "#4D6BC6", "#A87A1C"]

[theme.sidebar]
backgroundColor = "#F1ECE3"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
